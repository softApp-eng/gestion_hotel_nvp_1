<div class="-m-6 flex flex-col overflow-hidden">
    <mat-toolbar class="mat-accent h-14 min-h-14 px-4 m-0 flex-none">
        <div class="flex items-center w-full justify-between">
            <div class="flex items-center">
                <mat-icon class="icon-size-5 mr-3 text-white" svgIcon="heroicons_outline:trash"></mat-icon>
                <span class="text-lg text-white">Supprimer la prestation</span>
            </div>
            <button mat-icon-button (click)="cancel()" aria-label="fermer" class="text-white">
                <mat-icon svgIcon="mat_solid:close" class="icon-size-6"></mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="p-6 md:p-8 space-y-5">
        <div class="flex items-start p-3 rounded-xl bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20 text-red-700 dark:text-red-300 text-sm">
            <mat-icon class="icon-size-5 mr-2 flex-none" svgIcon="heroicons_outline:exclamation-triangle"></mat-icon>
            <span>
                Vous êtes sur le point de supprimer
                <strong>{{ data?.name }}</strong>. Cette action est irréversible.
            </span>
        </div>

        <mat-form-field class="w-full" appearance="outline">
            <mat-label>Motif de la suppression</mat-label>
            <textarea matInput rows="3"
                      [(ngModel)]="reason"
                      required
                      placeholder="Ex : saisie en double, erreur de bénéficiaire..."></textarea>
            <mat-hint>Le motif est obligatoire (tracé dans le journal d'activité).</mat-hint>
        </mat-form-field>
    </div>

    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t bg-gray-50 dark:bg-transparent">
        <button mat-stroked-button class="rounded-xl" (click)="cancel()">Annuler</button>
        <button mat-flat-button color="warn" class="rounded-xl"
                [disabled]="!reason || !reason.trim()"
                (click)="confirm()">
            <mat-icon class="icon-size-5 mr-1" svgIcon="heroicons_outline:trash"></mat-icon>
            Supprimer
        </button>
    </div>
</div>
