<h2 mat-dialog-title>
    {{ data.price ? 'Modifier le prix' : 'Nouveau prix' }}
</h2>

<form [formGroup]="form" class="p-4 space-y-4">

    <mat-form-field class="w-full p-2 text-2xl" [appearance]="'outline'">
        <mat-label>Categorie</mat-label>
        <mat-select [formControlName]="'category'">
            @for (c of categories; track c?.code) {
                <mat-option [value]="c?.code">{{c?.name}}</mat-option>
            }
        </mat-select>
        @if (form.get('category').hasError('required')) {
            <mat-error>Champ obligatoire</mat-error>
        }
    </mat-form-field>

    <mat-form-field class="w-full" appearance="outline">
        <mat-label>Prix (DH)</mat-label>
        <input matInput type="number" formControlName="price">
        <mat-error *ngIf="form.get('price')?.hasError('required')">
            Champ obligatoire
        </mat-error>
    </mat-form-field>

    <div class="flex justify-end space-x-2">
        <button mat-button (click)="dialogRef.close()">Annuler</button>
        <button mat-flat-button color="primary"
                [disabled]="form.invalid || isLoading"
                (click)="save()">
            Enregistrer
        </button>
    </div>

</form>
