<div class="-m-6 flex flex-auto flex-col md:w-240 md:min-w-240 overflow-hidden">
    <mat-toolbar class=" mat-accent h-14 min-h-14 px-2 m-0 flex-none">
        <div class="flex items-center w-full justify-between">
            <div class="flex items-center" >
                <mat-icon class="icon-size-5 mr-3 text-white" [svgIcon]="'heroicons_solid:filter'"></mat-icon>
                <span class="text-xl  text-white">Prix</span>
            </div>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="fermer" class="text-white">
                <mat-icon svgIcon="mat_solid:close" class="icon-size-6"></mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="m-6">

        <ng-container>
            <div class="flex items-end justify-end">
                <button mat-flat-button color="primary" (click)="raisePriceCreate()">
                    Nouveau
                </button>
            </div>
            <div class="h-100 overflow-y-auto border-gray-300 leading-none dark:border-gray-500">
                <table mat-table [dataSource]="dataSource" matSort >

                    <ng-container matColumnDef="category">
                        <th mat-header-cell mat-sort-header *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 25%"> CATEGORIE </th>
                        <td mat-cell *matCellDef="let row">
                            <p class="font-semibold">{{row?.category}}</p>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="price">
                        <th mat-header-cell mat-sort-header *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 25%"> PRIX </th>
                        <td mat-cell *matCellDef="let row">
                            <p>{{row?.price}}</p>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 5%"></th>
                        <td mat-cell *matCellDef="let row">
                            <div class="flex items-center justify-end space-x-1">

                                <button mat-icon-button class="w-8 h-8 min-h-8" matTooltip="Modifier" (click)="raisePriceCreate(row)">
                                    <mat-icon class="icon-size-4 text-current" [svgIcon]="'heroicons_outline:pencil-square'"></mat-icon>
                                </button>

                                <button mat-icon-button class="w-8 h-8 min-h-8" matTooltip="Supprimer" (click)="deletePrice(row)">
                                    <mat-icon class="icon-size-4 text-red-600 dark:text-red-400" [svgIcon]="'heroicons_outline:trash'"></mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let element; columns: displayedColumns;" class="example-element-row"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" [attr.colspan]="displayedColumns.length">

                            <div class="border-t p-8 text-center text-4xl font-semibold tracking-tight sm:p-16">
                                @if (!isLoading){
                                    Aucune donnée trouvée
                                } @else {
                                    Chargement
                                }
                            </div>
                        </td>
                    </tr>
                </table>

                <hr class="my-2 border-t border-gray-200" />
            </div>
        </ng-container>

    </div>
</div>
