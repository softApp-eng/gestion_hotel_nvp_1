<div class="flex min-w-0 flex-auto flex-col">
    <!-- Header -->
    <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between px-6 py-6 md:px-10 border-b bg-card dark:bg-transparent transition-all duration-200">
        <div class="absolute inset-x-0 bottom-0 h-1 bg-gradient-to-r from-primary-500/20 via-transparent to-transparent"></div>
        <div class="flex-1 min-w-0">
            <div class="flex items-center space-x-2 text-secondary font-medium text-sm mb-2">
                <a class="hover:text-primary transition-colors cursor-pointer">Gestion</a>
                <mat-icon class="icon-size-4" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
                <span class="text-primary-600 dark:text-primary-400">Réservations</span>
            </div>
            <div class="flex items-center">
                <div class="flex items-center justify-center p-3 mr-4 rounded-xl bg-primary-50 dark:bg-primary-500/10 text-primary shadow-sm">
                    <mat-icon class="icon-size-10" [svgIcon]="'heroicons_solid:calendar-days'"></mat-icon>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-none text-slate-900 dark:text-white">
                        Occupation
                    </h2>
                    <p class="text-secondary font-medium mt-1 text-md hidden sm:block">
                        Calendrier interactif des disponibilités et suivi temporel de l'occupation des chambres par pavillon.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div class="flex-auto ">
        <div class="flex-auto ">
            <div class="relative flex h-full min-w-0 flex-col overflow-hidden">
                <!--        <div class="absolute inset-0 flex min-w-0 flex-col overflow-hidden">-->
                <div class="flex flex-auto flex-col p-2 sm:p-8">

                    <div class="w-full bg-card border flex flex-col rounded-2xl p-2 sm:p-8 pb-4 shadow">
                        <full-calendar #fullCalendar [options]="calendarOptions()"></full-calendar>

                        <div class="mt-6 flex flex-wrap items-center justify-center gap-x-6 gap-y-2 border-t pt-4">

                            <div class="flex items-center" matTooltip="La réservation est validée, la chambre est officiellement occupée.">
                                <div class="w-3.5 h-3.5 rounded-full mr-2 shadow-sm" style="background-color: #4f46e5;"></div>
                                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Confirmé</span>
                            </div>

                            <div class="flex items-center" matTooltip="La demande d'occupation est enregistrée mais en attente de traitement.">
                                <div class="w-3.5 h-3.5 rounded-full mr-2 shadow-sm" style="background-color: #64748b;"></div>
                                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">En attente</span>
                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
