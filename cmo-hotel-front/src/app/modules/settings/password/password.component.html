<div class="w-full max-w-3xl">
    <!-- Form -->
    <form [formGroup]="form">
        <!-- Section -->
        <div class="w-full">
            <div class="text-xl">
                Informations d'identification
            </div>
            <div class="text-secondary">
                Changer vos informations d'identification
            </div>
        </div>
        <div class="mt-8 grid w-full gap-6 sm:grid-cols-4">

            <!-- Name -->
            <div class="sm:col-span-4">
                <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                    <mat-label>Mot de pass actuel</mat-label>
                    <mat-icon class="icon-size-5" [svgIcon]="'mat_solid:vpn_key'" matPrefix></mat-icon>
                    <input [formControlName]="'currentPassword'" matInput type="password" />
                    @if (form.get('currentPassword').hasError('required')) {
                        <mat-error> Champs obligatoire </mat-error>
                    }
                </mat-form-field>
            </div>
            <div class="sm:col-span-4">
                <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                    <mat-label>Nouveau mot de passe</mat-label>
                    <mat-icon class="icon-size-5" [svgIcon]="'mat_solid:vpn_key'" matPrefix></mat-icon>
                    <input [formControlName]="'newPassword'" matInput type="password"/>
                    @if (form.get('newPassword').hasError('required')) {
                        <mat-error> Champs obligatoire </mat-error>
                    }
                </mat-form-field>
            </div>

        </div>

        <!-- Divider -->
        <div class="mb-10 mt-11 border-t"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end">
            <button
                class="ml-4"
                mat-flat-button
                type="button"
                [color]="'primary'"
                [disabled]="form.disabled || form.invalid"
                (click)="update()"
            >
                Changer
            </button>
        </div>
    </form>
</div>
