<div class="-m-6 flex flex-auto flex-col md:w-240 md:min-w-240 overflow-hidden">
    <mat-toolbar class=" mat-accent h-14 min-h-14 px-2 m-0 flex-none">
        <div class="flex items-center w-full justify-between">
            <div class="flex items-center" >
                <mat-icon class="icon-size-5 mr-3 text-white" [svgIcon]="'heroicons_solid:filter'"></mat-icon>
                <span class="text-xl  text-white">Fiche de renseignement</span>
            </div>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="fermer" class="text-white">
                <mat-icon svgIcon="mat_solid:close" class="icon-size-6"></mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="m-6">

            <ng-container>
                <div class="flex items-start justify-between">
                    <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded min-w-64">
                        <mat-icon class="icon-size-5" matPrefix [svgIcon]="'search'"></mat-icon>
                        <input
                            matInput
                            #input
                            [matTooltip]="'Chercher'"
                            [autocomplete]="'off'"
                            (input)="search(input.value)"
                            [placeholder]="'Search'">
                    </mat-form-field>
                    <button mat-flat-button color="primary" (click)="save()">
                        Enregistrer
                    </button>
                </div>
                <div class="h-100 overflow-y-auto border-gray-300 leading-none dark:border-gray-500">
                    <table mat-table [dataSource]="dataSource" matSort >

                        <ng-container matColumnDef="name">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 25%"> Nom </th>
                            <td mat-cell *matCellDef="let row">
                                <p class="font-semibold" [innerHTML]="row?.name | highlight:key"></p>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="type">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 20%"> TYPE </th>
                            <td mat-cell *matCellDef="let row">
                                <p [innerHTML]="row?.type | highlight:key"></p>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="isNational">
                            <th mat-header-cell mat-sort-header *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 30%">Porté</th>
                            <td mat-cell *matCellDef="let row">
                            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-bold uppercase tracking-wide"
                                  [ngClass]="{
                                        'bg-blue-200 text-blue-800 dark:bg-blue-600 dark:text-blue-50':
                                            row.category == 'SITE_INTERNATIONAL',
                                        'bg-purple-200 text-purple-800 dark:bg-purple-600 dark:text-purpled-50':
                                            row.category == 'PROVENANCE',
                                        'bg-green-200 text-green-800 dark:bg-green-600 dark:text-green-50':
                                            row.category == 'SITE_NATIONAL',
                                    }"
                            >
                                    <span class="whitespace-nowrap leading-relaxed">{{ row.category == 'SITE_NATIONAL' ? 'National' : row.category == 'SITE_INTERNATIONAL' ? 'International': row.category == 'PROVENANCE' ? 'Provenance':''}}</span>
                                </span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-transparent" style="width: 5%">  </th>
                            <td mat-cell *matCellDef="let row">
                                <mat-checkbox
                                    class="flex h-10 min-h-10 items-center pl-1 pr-4"
                                    [color]="'primary'"
                                    [checked]="isModuleSelected(row?.id)"
                                    (change)="toggleModule(row?.id, $event.checked)"
                                >
                                </mat-checkbox>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let element; columns: displayedColumns;" class="example-element-row"></tr>

                        <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell" [attr.colspan]="displayedColumns.length">

                                <div class="border-t p-8 text-center text-4xl font-semibold tracking-tight sm:p-16">
                                    @if (!isLoading){
                                        Aucune donnée trouvée
                                    } @else {
                                        Chargement
                                    }
                                </div>
                            </td>
                        </tr>
                    </table>
                    <mat-paginator
                        class="w-full border-b bg-gray-50 dark:bg-transparent"
                        showFirstLastButtons="true"
                        #paginator
                        [length]="totalRows"
                        [pageIndex]="currentPage"
                        [pageSize]="10"
                        [pageSizeOptions]="[10, 20, 50]"
                    ></mat-paginator>
                    <hr class="my-2 border-t border-gray-200" />
                </div>
            </ng-container>

    </div>
</div>
