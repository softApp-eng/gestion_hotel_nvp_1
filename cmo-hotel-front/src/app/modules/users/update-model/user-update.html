<div class="-m-6 flex flex-auto flex-col md:w-160 md:min-w-160 overflow-hidden">
    <mat-toolbar class=" mat-accent h-14 min-h-14 px-2 m-0 flex-none">
        <div class="flex items-center w-full justify-between">
            <div class="flex items-center" >
                <mat-icon class="icon-size-5 mr-3 text-white" [svgIcon]="'heroicons_solid:filter'"></mat-icon>
                <span class="text-xl  text-white">{{title}}</span>
            </div>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="fermer" class="text-white">
                <mat-icon svgIcon="mat_solid:close" class="icon-size-6"></mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="m-6">
        <form [formGroup]="form">
            <mat-form-field class="w-full p-2 text-2xl" [appearance]="'outline'">
                <mat-label>Identifiant</mat-label>
                <input matInput [formControlName]="'username'" placeholder="Identifiant">
                @if (form.get('username').hasError('required')) {
                    <mat-error>Champ obligatoire</mat-error>
                }
                @if (form.get('username').hasError('minLength')) {
                    <mat-error>Taille saisie insuffisante</mat-error>
                }
            </mat-form-field>

            <mat-form-field class="w-full p-2 text-2xl" [appearance]="'outline'">
                <mat-label>Nom</mat-label>
                <input matInput [formControlName]="'firstName'" placeholder="Nom">
            </mat-form-field>

            <mat-form-field class="w-full p-2 text-2xl" [appearance]="'outline'">
                <mat-label>Prenom</mat-label>
                <input matInput [formControlName]="'lastName'" placeholder="Prenom">
            </mat-form-field>

            <mat-slide-toggle
                class="mt-8 sm:ml-auto sm:mt-0 w-full p-2 text-2xl"
                [color]="'primary'"
                formControlName="status"
            >
                Active
            </mat-slide-toggle>


            <div class="flex items-start justify-between mx-3 mt-8">
                <button mat-stroked-button (click)="matDialogRef.close()">
                    Annuler
                </button>
                <button mat-flat-button [color]="'primary'" [disabled]="form.disabled || form.invalid" (click)="save()">
                    Enregistrer
                </button>
            </div>

        </form>

    </div>
</div>
