<div class="flex flex-col max-h-[90vh] md:w-240 md:min-w-240 overflow-hidden -m-6">
    <mat-toolbar class="mat-accent h-14 min-h-14 px-2 m-0 flex-none z-10">
        <div class="flex items-center w-full justify-between">
            <div class="flex items-center" >
                <mat-icon class="icon-size-5 mr-3 text-white" [svgIcon]="'heroicons_solid:filter'"></mat-icon>
                <span class="text-xl  text-white">Clients</span>
            </div>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="fermer" class="text-white">
                <mat-icon svgIcon="mat_solid:close" class="icon-size-6"></mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="m-6 mb-4 flex-none">
        <div class="flex items-start justify-between">
            <mat-form-field class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded min-w-64">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'search'"></mat-icon>
                <input
                    matInput
                    #inputKey
                    matTooltip="chercher"
                    [autocomplete]="'off'"
                    (keyup.enter)="key = inputKey.value;search()"
                    [placeholder]="'chercher'">
            </mat-form-field>
            <a mat-stroked-button class="ml-4" (click)="raisePersonCreate()">
                <span class="inline-flex items-center text-sm">
                    <span>Créer personne</span>
                    <mat-icon class="ml-1 icon-size-4" [svgIcon]="'mat_solid:person_add_alt_1'"></mat-icon>
                </span>
            </a>
        </div>
    </div>

    <div class="flex-auto overflow-y-auto px-6">
        <table mat-table [dataSource]="dataSource" class="w-full">

            <ng-container matColumnDef="grade">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 10%"> GRADE </th>
                <td mat-cell *matCellDef="let row">
                    <p [innerHTML]="row?.grade?.code | highlight:key"></p>
                </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 30%"> NOM </th>
                <td mat-cell *matCellDef="let row" >
                    <p [innerHTML]="(((row?.gender == 'F')?'Mme ':(row?.gender == 'M')?'Mr ':'') + row?.firstName + ' ' + row?.lastName) | highlight:key"></p>
                </td>
            </ng-container>

            <ng-container matColumnDef="identity">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 15%"> IDENTITE </th>
                <td mat-cell *matCellDef="let row" >
                    <p [innerHTML]="row?.identity | highlight:key"></p>
                </td>
            </ng-container>

            <ng-container matColumnDef="unite">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 20%"> UNITE </th>
                <td mat-cell *matCellDef="let row">
                    <p [innerHTML]="row?.unite | highlight:key"></p>
                </td>
            </ng-container>

            <ng-container matColumnDef="matricule">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 19%"> MATRICULE </th>
                <td mat-cell *matCellDef="let row">
                    <p [innerHTML]="row?.matricule | highlight:key"></p>
                </td>
            </ng-container>

            <ng-container matColumnDef="selection">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 3%">  </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox
                        class="flex h-10 min-h-10 items-center pl-1 pr-4"
                        [color]="'primary'"
                        [checked]="isModuleSelected(row.id)"
                        (change)="toggleModule(row, $event.checked)"
                    >
                    </mat-checkbox>
                </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef class="bg-gray-50 dark:bg-gray-800 sticky top-0 z-10" style="width: 3%">  </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button [matMenuTriggerFor]="menuAction">
                        <mat-icon class="icon-size-5" [svgIcon]=" 'heroicons_mini:ellipsis-vertical' " ></mat-icon>
                    </button>
                    <mat-menu #menuAction="matMenu" >
                        <button mat-menu-item (click)="raisePersonCreate(row)" >
                            <mat-icon svgIcon="edit" ></mat-icon>
                            <span>Modifier</span>
                        </button>
                        <!--<button mat-menu-item (click)="raisePersonCreate(row,true)" >
                            <mat-icon svgIcon="edit" ></mat-icon>
                            <span>Ajouter famille</span>
                        </button>-->
                        <button mat-menu-item class="text-red-800 dark:text-red-50 ">
                            <mat-icon class="text-red-800 dark:text-red-50" svgIcon="mat_solid:delete_forever" ></mat-icon>
                            <span class="font-semibold">Supprimer</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="sticky top-0 z-10"></tr>
            <tr mat-row *matRowDef="let element; columns: displayedColumns;" class="example-element-row"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    <div class="p-8 text-center text-4xl font-semibold tracking-tight sm:p-16">
                        @if (!isLoading){ Aucune donnée trouvée } @else { Chargement }
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <div class="p-6 pt-0 flex-none bg-white dark:bg-transparent">
        <mat-paginator
            [ngClass]="{ 'pointer-events-none': isLoading }"
            showFirstLastButtons="true"
            [length]="totalRows"
            [pageIndex]="currentPage"
            [pageSize]="pageSize"
            [pageSizeOptions]="pageSizeOptions"
            (page)="pageChanged($event)"
        ></mat-paginator>

        <hr class="my-2 border-t border-gray-200" />

        <div class="flex items-end justify-end">
            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="saveAndClose()" >
                <span class="ml-2 mr-1">{{'Sélectionner (' + selectedPersons.length + ') selectionnée'}} </span>
            </button>
        </div>
    </div>
</div>
