<div class="-m-6 flex flex-col max-h-[95vh] md:w-160 md:min-w-160 overflow-hidden">
    <mat-toolbar class=" mat-accent h-14 min-h-14 px-2 m-0 flex-none">
        <div class="flex items-center w-full justify-between">
            <div class="flex items-center" >
                <mat-icon class="icon-size-5 mr-3 text-white" [svgIcon]="'heroicons_solid:filter'"></mat-icon>
                <span class="text-xl  text-white">{{title}}</span>
            </div>
            <button mat-icon-button (click)="matDialogRef.close()" aria-label="fermer" class="text-white">
                <mat-icon svgIcon="mat_solid:close" class="icon-size-6"></mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="flex-auto overflow-y-auto p-6">
        <form [formGroup]="form">

            <mat-form-field class="w-full p-2 text-2xl" [appearance]="'outline'">
                <mat-label>Agent</mat-label>
                <mat-select [formControlName]="'agentId'">
                    @for (g of agents; track g.id) {
                        <mat-option [value]="g.id">{{g.firstName + ' ' + g.lastName}}</mat-option>
                    }
                </mat-select>
                @if (form.get('agentId').hasError('required')) {
                    <mat-error>Champ obligatoire</mat-error>
                }
            </mat-form-field>

            <div class="flex flex-row items-center gap-2 w-full p-2">
                <mat-form-field class="flex-auto text-2xl" [appearance]="'outline'" [subscriptSizing]="'dynamic'">
                    <mat-label>Date de ménage</mat-label>
                    <input matInput [matDatepicker]="dp3" formControlName="date">
                    <mat-datepicker-toggle matIconSuffix [for]="dp3"></mat-datepicker-toggle>
                    <mat-datepicker #dp3></mat-datepicker>
                    <mat-error *ngIf="form.get('date').hasError('required')">Date requise</mat-error>
                </mat-form-field>

                <mat-form-field class="w-44 text-lg" [appearance]="'outline'" [subscriptSizing]="'dynamic'">
                    <mat-label>Heure de début</mat-label>

                    <input matInput
                           type="time"
                           formControlName="timeStart"
                           #timeStartInput
                           >
                    <mat-icon matSuffix
                              class="text-secondary cursor-pointer icon-size-5"
                              (click)="timeStartInput.showPicker()"
                              [svgIcon]="'heroicons_outline:clock'">
                </mat-icon>

                    <mat-error *ngIf="form.get('timeStart').hasError('required')">
                        Heure requise
                    </mat-error>
                </mat-form-field>

                <mat-form-field class="w-44 text-lg" [appearance]="'outline'" [subscriptSizing]="'dynamic'">
                    <mat-label>Heure de fin</mat-label>

                    <input matInput
                           type="time"
                           formControlName="timeEnd"
                           #timeInput>

                    <mat-icon matSuffix
                              class="text-secondary cursor-pointer icon-size-5"
                              (click)="timeInput.showPicker()"
                              [svgIcon]="'heroicons_outline:clock'">
                    </mat-icon>

                    <mat-error *ngIf="form.get('timeEnd').hasError('required')">
                        Heure requise
                    </mat-error>
                </mat-form-field>

            </div>

            <mat-form-field class="w-full p-2 text-2xl" [appearance]="'outline'">
                <mat-label>Anomalies constatées</mat-label>
                <textarea
                    [formControlName]="'comment'"
                    matInput
                    cdkTextareaAutosize
                    cdkAutosizeMinRows="2"
                    cdkAutosizeMaxRows="5"
                    #autosize="cdkTextareaAutosize">
                    </textarea>
            </mat-form-field>


            <div class="flex items-start justify-between mx-3 mt-8">
                <button mat-stroked-button (click)="matDialogRef.close()">
                    Annuler
                </button>
                <button mat-flat-button [color]="'primary'" [disabled]="form.disabled || form.invalid" (click)="save()">
                    Enregistrer
                </button>
            </div>
        </form>

    </div>
</div>
