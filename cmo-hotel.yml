services:
  # 1. PostgreSQL Database
  postgresdb:
    image: postgres:17.9-alpine3.23
    container_name: postgresdb
    environment:
      - POSTGRES_USER=admin          # Matches your db.username
      - POSTGRES_PASSWORD=123456     # Matches your db.password
      - POSTGRES_DB=cmo_db           # Your DB name
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # named volume to persists data even if container is deleted

  # 2. Spring Boot Backend
  backend:
    build: ./cmo-hotel-back
    container_name: cmo-backend
    ports:
      - "8888:8888"
    depends_on:
      - postgresdb
    environment:
      # Direct overrides for Spring properties
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:5432/cmo_db?useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=123456
      - APP_CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - SPRING_PROFILES_ACTIVE=default # or prod
#      - APP_DATABASE_FEED=true

    working_dir: /app

  # 3. Angular Frontend
  frontend:
    build: ./cmo-hotel-front     # Path to your Angular Dockerfile
    container_name: cmo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
