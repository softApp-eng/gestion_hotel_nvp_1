# =====================================================================
#  H2 PROFILE - local testing only (no PostgreSQL required)
#  Activate with:  --spring.profiles.active=h2
# =====================================================================

# In-memory H2 database running in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:cmodb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console (http://localhost:8888/cmo-api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Let Hibernate create the schema from the entities
spring.jpa.database=h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Some entities use column names that are reserved keywords in H2 (e.g. "day"),
# so ask Hibernate to quote identifiers that collide with keywords.
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Do NOT let Spring Boot auto-run the PostgreSQL data.sql (it contains Postgres-only statements)
spring.sql.init.mode=never

# Feed the database through the Feeder (data-h2.sql + roles/accounts)
app.database.feed=true

# Quieter logs for local testing
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
