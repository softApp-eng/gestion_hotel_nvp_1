spring.application.name=cmo-hotel-back
spring.application.version=v1.0

# Server Properties
server.port=8888
# Context path of the application.
server.servlet.context-path=/cmo-api
## POSTGRES  sbk_starter
spring.datasource.url=jdbc:postgresql://localhost:5432/cmo_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
app.database.feed=false
spring.jpa.database=postgresql
# Logging JPA Queries to console
# Disable SQL query logging
spring.jpa.show-sql=false

# Disable Hibernate SQL logs
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
#spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.add-mappings=false
spring.jpa.properties.hibernate.format_sql=false
#MAIL CONFIG

#JWT CONFIG
app.jwt-secret=9d3dbdc0b91d74ce782d06999e8f517883270c5f5147775802ad0d54850c75bd4216393278cb81a0109f0014c334b96572584110e2618735a7ae400a293ea8d4
app.jwt-bearer=aitkhmim_
#Access token lifetime 7 mn
