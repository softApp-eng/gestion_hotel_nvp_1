spring.jackson.date-format= dd/MM/yyyy

#Info
app.app-name=cmo-hotel

# --- LOGGING CONFIGURATION ---

# Dossier où seront stockés les logs
logging.file.path=logs
# Nom du fichier de log principal
logging.file.name=logs/${spring.application.name}.log

# Taille maximale d'un fichier avant d'en créer un nouveau (Rotation)
logging.logback.rollingpolicy.max-file-size=1MB
# Nombre de jours de rétention des archives
logging.logback.rollingpolicy.max-history=30
# Taille totale maximale du dossier de logs
logging.logback.rollingpolicy.total-size-cap=50MB

# Format de sortie en console (plus lisible avec des couleurs)
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# Format de sortie dans le fichier (plus sobre, sans couleurs)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
