spring.application.name=cmo-hotel-back
spring.application.version=v1.0

# Import the external secrets file
#spring.config.import=optional:file:secrets.properties

# Server Properties
server.port=8888
# Context path of the application.
server.servlet.context-path=/cmo-api
## POSTGRES  sbk_starter
spring.datasource.url=jdbc:postgresql://localhost:5432/cmo_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=123456
#spring.datasource.username=admin
#spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
app.database.feed=false
spring.jpa.database=postgresql
# Logging JPA Queries to console
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.add-mappings=false
